<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cyber Error</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas, monospace;
}

body{
    height:100vh;
    background:#050510;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#00ffcc;
}

/* Background grid */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:
    linear-gradient(rgba(0,255,170,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,170,0.08) 1px, transparent 1px);
    background-size:40px 40px;
    animation:gridMove 8s linear infinite;
}

@keyframes gridMove{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(40px);
    }
}

.container{
    position:relative;
    z-index:2;
    text-align:center;
    padding:40px;
    border:1px solid #00ffcc55;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(5px);
    box-shadow:0 0 25px #00ffcc33;
    border-radius:15px;
    width:90%;
    max-width:600px;
}

.glitch{
    font-size:90px;
    font-weight:bold;
    position:relative;
    color:#00ffcc;
    text-shadow:
    0 0 10px #00ffcc,
    0 0 20px #00ffcc;
    animation:flicker 2s infinite;
}

.glitch::before,
.glitch::after{
    content:"404";
    position:absolute;
    left:0;
    width:100%;
}

.glitch::before{
    color:#ff00ff;
    animation:glitchTop 1s infinite;
}

.glitch::after{
    color:#00ffff;
    animation:glitchBottom 1s infinite;
}

@keyframes glitchTop{
    0%{transform:translate(0)}
    20%{transform:translate(-3px,-2px)}
    40%{transform:translate(3px,2px)}
    60%{transform:translate(-2px,1px)}
    80%{transform:translate(2px,-1px)}
    100%{transform:translate(0)}
}

@keyframes glitchBottom{
    0%{transform:translate(0)}
    20%{transform:translate(3px,2px)}
    40%{transform:translate(-3px,-2px)}
    60%{transform:translate(2px,-1px)}
    80%{transform:translate(-2px,1px)}
    100%{transform:translate(0)}
}

@keyframes flicker{
    0%,18%,22%,25%,53%,57%,100%{
        opacity:1;
    }
    20%,24%,55%{
        opacity:0.4;
    }
}

.subtitle{
    margin-top:15px;
    font-size:24px;
    letter-spacing:2px;
    color:#ffffff;
}

.desc{
    margin-top:10px;
    color:#a0fff0;
    font-size:15px;
}

.btn{
    margin-top:30px;
    padding:12px 28px;
    border:none;
    background:#00ffcc;
    color:#000;
    font-weight:bold;
    cursor:pointer;
    border-radius:8px;
    transition:0.3s;
    box-shadow:0 0 15px #00ffcc88;
}

.btn:hover{
    background:#00ccaa;
    transform:scale(1.05);
}

.matrix{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:1;
    pointer-events:none;
}

.matrix span{
    position:absolute;
    top:-100px;
    color:#00ff99;
    font-size:18px;
    animation:fall linear infinite;
    opacity:0.5;
}

@keyframes fall{
    to{
        transform:translateY(120vh);
    }
}
</style>
</head>
<body>

<div class="matrix" id="matrix"></div>

<div class="container">
    <div class="glitch">404</div>
    <div class="subtitle">SYSTEM BREACH DETECTED</div>
    <div class="desc">
        Access to this page has been denied.<br>
        Firewall protection activated.
    </div>

    <button class="btn" onclick="reloadPage()">
        RECONNECT
    </button>
</div>

<script>
function reloadPage(){
    location.reload();
}

/* Matrix rain effect */
const matrix = document.getElementById("matrix");

const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@";

for(let i=0; i<80; i++){

    let span = document.createElement("span");

    span.innerText = chars[Math.floor(Math.random()*chars.length)];

    span.style.left = Math.random()*100 + "vw";

    span.style.animationDuration = (Math.random()*3 + 2) + "s";

    span.style.fontSize = (Math.random()*20 + 10) + "px";

    span.style.opacity = Math.random();

    matrix.appendChild(span);
}
</script>

</body>
  </html>
